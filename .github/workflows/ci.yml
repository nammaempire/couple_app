# Checks every change automatically on GitHub: the app's analyzer and tests,
# the server's type check and tests (with a real Postgres), and a full
# Android build (debug, plus a release build with R8 shrinking, signed with
# the debug key since the upload key never goes to GitHub).
#
# Runs on every push to main and every pull request; also by hand from the
# Actions tab ("Run workflow"). Results: the Actions tab, and a ✓ or ✗ next
# to each commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  app:
    name: App — analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  server:
    name: Server — type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Type check
        run: |
          npx tsc --noEmit -p .
          npx tsc --noEmit -p scripts/tsconfig.json
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres@localhost:5432/postgres
          FUNCTIONS_LOG: "off"
      - name: Production build
        run: npm run build

  android:
    name: Android — build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Debug build
        run: flutter build apk --debug
      - name: Release build (R8; debug-signed, test only)
        run: flutter build apk --release
        env:
          US_ALLOW_DEBUG_SIGNING: "true"
