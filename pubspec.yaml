name: couple_app
description: "A private chat app for two."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  # Ending a pairing on the server (finalizeSeparation, leaveNow). Pinned to
  # the last release built on firebase_core 3.x (July 2025); 6.x needs
  # firebase_core 4.
  cloud_functions: 5.6.2

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Voice and video calling
  agora_rtc_engine: ^6.5.2
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

  # Onboarding: Google sign-in, invite QR code, QR scanning, share sheet
  google_sign_in: ^6.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.0

  # Chat: voice messages, video messages and thumbnails
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  video_player: ^2.14.0
  fc_native_video_thumbnail: ^3.0.1

  # Calendar reminders and love-note delivery alerts (on-device scheduling)
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_cache_manager: ^3.4.5

  # Opening wishlist links and places in Maps
  url_launcher: ^6.3.2

  # Music: song details from Spotify/YouTube links, in-app YouTube playback
  http: ^1.6.0
  youtube_player_iframe: ^6.0.2

  # App lock: fingerprint / face / phone PIN, and its per-device setting.
  # Pinned to releases at least two weeks old; the plugin's newest Android
  # and iOS implementations were days old when this was added.
  local_auth: ^3.0.2
  local_auth_android: 2.2.0
  local_auth_darwin: 2.0.4
  shared_preferences: 2.5.5

  # Private vault: end-to-end encryption (X25519, AES-GCM, HKDF, Argon2id in
  # pure Dart), this phone's private key and passcode state in the Android
  # keystore, and JPEG re-encoding of photos before they are encrypted.
  # Pinned to releases at least two weeks old.
  cryptography: 2.9.0
  flutter_secure_storage: 11.2.0
  flutter_secure_storage_platform_interface: 2.1.1
  image: 4.10.1
  archive: 4.3.0

  # Premium, gifts and memory books: Google Play billing, and the memory
  # book PDF made on the phone (pure Dart) with a viewer and share sheet.
  # Pinned to releases at least two weeks old; the plugin's newest Android
  # and StoreKit implementations were days old when this was added.
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.3
  in_app_purchase_storekit: 0.4.13
  in_app_purchase_platform_interface: 1.4.1
  pdf: 3.13.1
  printing: 5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # In-memory Firestore for MusicService tests
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    # Fonts embedded in memory book PDFs (licences in the folder).
    - assets/fonts/book/
