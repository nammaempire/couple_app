name: couple_app
description: "A private chat app for two."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Voice and video calling
  agora_rtc_engine: ^6.5.2
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1

  # Onboarding: Google sign-in, invite QR code, QR scanning, share sheet
  google_sign_in: ^6.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  share_plus: ^13.3.0

  # Chat: voice messages, video messages and thumbnails
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  video_player: ^2.14.0
  fc_native_video_thumbnail: ^3.0.1

  # Calendar reminders and love-note delivery alerts (on-device scheduling)
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_cache_manager: ^3.4.5

  # Opening wishlist links and places in Maps
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
