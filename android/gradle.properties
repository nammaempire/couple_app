org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Agora ships two AARs (iris-rtc and agora-special-full) that both declare the
# namespace io.agora.rtc. AGP 9 enforces unique namespaces across libraries and
# fails the manifest merge over it. We cannot edit those AARs, so relax the
# check until Agora publishes fixed artifacts.
#
# This flag is deprecated and Google may remove it in a future AGP. If a later
# upgrade rejects it, the fallback is pinning AGP to 8.7.x in
# android/settings.gradle.kts.
android.uniquePackageNames=false
